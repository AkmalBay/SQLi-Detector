<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="#4c6fff"/>

  <!-- Shopping Cart Icon -->
  <g transform="translate(25, 25)">
    <!-- Cart Body -->
    <rect x="5" y="15" width="35" height="25" rx="3" fill="white"/>
    <!-- Cart Handle -->
    <path d="M 10 15 L 10 5 Q 10 2 15 2 L 30 2 Q 35 2 35 5 L 35 15" stroke="white" stroke-width="3" fill="none"/>
    <!-- Wheels -->
    <circle cx="13" cy="47" r="4" fill="white"/>
    <circle cx="33" cy="47" r="4" fill="white"/>
  </g>

  <!-- Text "S" for Sembako -->
  <text x="50" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">S</text>
</svg>
